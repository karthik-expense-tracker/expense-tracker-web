name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-sonar-instance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write 

jobs: 
  start-instance:
    runs-on: ubuntu-latest
    outputs:
      sonar-host: ${{ steps.sonar-host.outputs.url }}
    steps:
      - name:  Checkout 
        uses: actions/checkout@v4
      - name: configure AWS 
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name : Start sonar scan instance
        run: aws ec2 start-instances --instance-ids ${{ secrets.INSTANCE_ID }}

      
      - name: Wait for instance to be ready
        run: aws ec2 wait instance-status-ok --instance-ids "${{ secrets.INSTANCE_ID }}"

      - name: Get SonarQube host
        id: sonar-host
        run: |
          public_ip=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          if [[ -z "$public_ip" || "$public_ip" == "None" ]]; then
            echo "EC2 instance has no public IP address" >&2
            exit 1
          fi
          echo "url=http://${public_ip}:9000" >> "$GITHUB_OUTPUT"

  test:
    needs: [start-instance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install

      - name: Run test
        run : npm test

      - name: Run linter
        run: npm run lint

      - name: Wait for SonarQube to accept requests
        env:
          SONAR_HOST_URL: ${{ needs.start-instance.outputs.sonar-host }}
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$SONAR_HOST_URL/api/server/version" > /dev/null; then
              echo "SonarQube is ready"
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time" >&2
          exit 1


      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ needs.start-instance.outputs.sonar-host }}
  
  stop-instance:
    needs: [start-instance, test]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout 
        uses: actions/checkout@v4
      - name: configure AWS 
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop sonar scan instance
        run: aws ec2 stop-instances --instance-ids ${{ secrets.INSTANCE_ID }}
